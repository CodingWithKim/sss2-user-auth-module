<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Auth — Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="site-title">
    🔐 Secure Auth
    <span class="badge-v5">v5</span>
  </div>
  <div class="user-badge" id="user-badge">
    <span id="badge-username"></span>
    <span class="role-chip" id="badge-role"></span>
    <button class="btn-logout" onclick="doLogout()">Logout</button>
  </div>
</header>

<div class="auth-section section">
  <div class="wrap">
    <div class="section-label">Authentication</div>
    <div class="auth-center">

      <div class="auth-card" id="auth-card">

        <div class="tab-bar">
          <button class="tab active" id="tab-login"    onclick="switchTab('login')">Login</button>
          <button class="tab"        id="tab-register" onclick="switchTab('register')">Register</button>
        </div>

        <div class="auth-body" id="pane-login">
          <div class="form-row">
            <label for="login-username">Username</label>
            <input type="text"     id="login-username" placeholder="your_username" autocomplete="username">
          </div>
          <div class="form-row">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
          </div>
          <button class="btn-submit" onclick="doLogin()">Login</button>
        </div>

        <div class="auth-body hidden" id="pane-register">
          <div class="form-row">
            <label for="reg-username">Username</label>
            <input type="text"     id="reg-username" placeholder="new_username" autocomplete="username">
          </div>
          <div class="form-row">
            <label for="reg-email">Email</label>
            <input type="email"    id="reg-email"    placeholder="you@example.com" autocomplete="email">
          </div>
          <div class="form-row">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" placeholder="Min 8 chars · upper · digit · symbol" autocomplete="new-password">
          </div>
          <div class="form-row">
            <label for="reg-role">Role</label>
            <select id="reg-role">
              <option value="customer">Customer</option>
              <option value="support">Support</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <button class="btn-submit" onclick="doRegister()">Create Account</button>
        </div>

        <div class="auth-msg" id="auth-msg"></div>

        <div class="auth-footer" id="auth-footer">
          <p>Session active — scroll down to run tests</p>
          <button class="btn-logout" onclick="doLogout()">Logout</button>
        </div>

      </div>

    </div>
  </div>
</div>

<div class="test-section section" id="test-section">
  <div class="wrap">

    <div class="test-section-head">
      <div class="section-label">Security Test Suite</div>
      <span class="lock-tag" id="lock-tag">🔒 Login to unlock</span>
    </div>

    <div class="test-grid" id="test-grid"></div>

  </div>

  <div class="lock-overlay" id="lock-overlay">
    <div class="lock-box">
      <span class="lock-icon">🔒</span>
      <p>Login above to unlock the test suite</p>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
